# AutoResearchClaw 通用配置模板（领域无关）
# 用法：cp config.template.yaml config.arc.yaml，改 research.topic 与 experiment 指标即可。
# 领域预设示例：config.rc-remote-sensing.yaml（遥感）；换领域 = 换 topic + domains +
# metric_key + 沙箱镜像（sandbox-rs 只是预装了遥感库，通用任务用 experiment:latest 足够）。
project:
  name: "my-autoresearch"
  mode: "full-auto"

research:
  topic: "任何领域的研究问题"
  domains:
    - "machine-learning"        # 决定文献检索与假设生成的语境，可多个
  daily_paper_count: 10
  quality_threshold: 4.0

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 1         # 按 GPU 数调整
  approval_timeout_hours: 24
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

llm:
  provider: "openai-compatible"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"   # 百炼；换 OpenAI/Claude 只改这里
  api_key_env: "DASHSCOPE_API_KEY"
  primary_model: "qwen3-coder-plus"
  fallback_models:
    - "qwen-plus"

literature_search:
  sources: ["openalex", "semantic_scholar", "arxiv"]
  max_results_per_query: 40

experiment:
  mode: "docker"
  scale: "pilot"               # 规模诚实标签：smoke/pilot/full，会写进论文的规模声明
  time_budget_sec: 300          # 按任务量级调：轻量 ML 300s 起步，训练类 900s+
  max_iterations: 10
  metric_key: "val_loss"        # 与评分脚本输出一致的单一标量指标
  metric_direction: "minimize"
  docker:
    image: "researchclaw/experiment:latest"   # 通用 GPU 栈；特定领域可换专属镜像
    network_policy: "setup_only"
    gpu_enabled: true
    memory_limit_mb: 24576
    auto_install_deps: true
  sandbox:
    python_path: "python3"
    gpu_required: true
    allowed_imports: [math, random, json, csv, numpy, scipy, torch, torchvision,
                      sklearn, pandas, matplotlib, yaml, seaborn]
    max_memory_mb: 24576
  repair:
    enabled: true
    max_cycles: 3
    min_completion_rate: 0.5
    min_conditions: 2

# ── 论文复现（可选；整段缺省即有默认值，老配置不用动）──────────────
# 选题卡片/Chat「复现这篇」走这里：找官方 repo → 沙箱克隆真跑 → 《复现报告》。
# 沙箱镜像/GPU/内存复用上面 experiment.docker 段。
# reproduce:
#   enabled: true
#   max_rounds: 8               # LLM「装环境→跑通→修复」循环上限
#   time_budget_sec: 7200       # 单次复现总时间预算（wall clock）
#   network_policy: "full"      # 复现代码常需运行时下载数据/权重；改 "setup_only" 复用实验的严格姿态

hitl:
  enabled: true
  mode: co-pilot
  cost_budget_usd: 50.0
  notifications:
    on_pause: true
    on_quality_drop: true
    channels: ["terminal"]
  timeouts:
    default_human_timeout_sec: 86400
    auto_proceed_on_timeout: false

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

export:
  target_conference: "tgrs"      # 遥感 ML 的 SCI 一区目标（IEEE TGRS，IEEEtran 双栏）；可选 neurips_2025 / iclr_2026 / icml_2026
  authors: "Anonymous"

# 论文产出自动同步到 Overleaf 共享项目（每个 run 一个 runs/<run_id>/ 文件夹）
# token 走环境变量 OVERLEAF_TOKEN（.env），不落文件
overleaf:
  enabled: true
  git_url: "https://git.overleaf.com/6abf1ff4f69d58b37f570e1a"
  branch: "main"
  auto_push: true

metaclaw_bridge:
  enabled: true
