# AutoResearchClaw 本地部署（V100 单机版）
# 用法见 DOCKER_CN.md。要点：
#   - control   = 控制面（研究流水线本体）
#   - 实验沙箱镜像不在此编排——由 researchclaw 在 docker 模式下动态 docker run，
#     需先按 DOCKER_CN.md 构建 researchclaw/experiment:latest 与
#     researchclaw/sandbox-rs:latest，并把本用户加入 docker 组（挂载 socket 供容器内调度）。
services:
  control:
    build:
      context: .
      dockerfile: docker/Dockerfile.control
    image: researchclaw/control:latest
    container_name: rc-control
    env_file: .env
    volumes:
      - ./:/app                    # 源码热挂载：本地改配置/skill 无需重建镜像
      - ./frontend-legacy:/app/frontend   # 仪表盘前端（server 按 /app/frontend 查找）
      - ./artifacts:/app/artifacts # 所有 run 产物落在宿主机
      - /var/run/docker.sock:/var/run/docker.sock  # 容器内 docker CLI 调度实验沙箱
    working_dir: /app
    group_add: ["${DOCKER_GID:-999}"]  # 宿主 docker 组 GID，容器内可写 docker.sock
    stdin_open: true
    tty: true
    # 交互示例：
    #   docker compose run --rm control run --config config.arc.yaml --topic "..." --mode co-pilot
    #   （config.arc.yaml 默认软链到 config.template.yaml 通用模板；
    #     特定领域可用预设，如 --config config.rc-remote-sensing.yaml）
    #   docker compose run --rm control status artifacts/rc-xxxx
    command: --help

  # Web 仪表盘：浏览器开 http://localhost:8088
  # 监控各 run 的阶段进度/实验曲线/论文预览，HITL 聊天面板也在其中（ChatPanel）
  dashboard:
    image: researchclaw/control:latest
    container_name: rc-dashboard
    env_file: .env
    volumes:
      - ./:/app
      - ./frontend-legacy:/app/frontend
      - ./artifacts:/app/artifacts
    working_dir: /app
    group_add: ["${DOCKER_GID:-999}"]
    ports:
      - "8088:8088"
    command: dashboard --host 0.0.0.0 --port 8088 --config config.arc.yaml
