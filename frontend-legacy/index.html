<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>ResearchClaw — 科研工作空间</title>
  <link rel="stylesheet" href="/static/src/styles/main.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>ResearchClaw</h1>
      <span id="server-status" style="font-size:12px;color:var(--text-muted)"></span>
      <span id="connection-badge" class="status-badge idle">Connecting...</span>
      <div class="header-spacer"></div>
      <span class="header-caption">Research workspace</span>
      <button id="lang-toggle" data-no-i18n title="切换到英文">EN</button>
    </header>

    <!-- Sidebar: project list -->
    <nav class="sidebar proj-sidebar" aria-label="Projects">
      <button class="proj-new-btn" id="btn-new-research"><span aria-hidden="true">＋</span><span>New Research</span></button>
      <div class="proj-side-label">Projects</div>
      <div id="sidebar-projects"></div>
      <div class="proj-side-bottom">
        <a href="#" id="nav-settings">Settings</a>
        <a href="#" id="nav-about">About</a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main" id="main-content">
      <p style="color:var(--text-muted)">Loading...</p>
    </main>
  </div>

  <!-- Scripts (no build step needed) -->
  <script src="/static/src/services/i18n.js"></script>
  <script src="/static/src/services/api.js"></script>
  <script src="/static/src/services/websocket.js"></script>
  <script src="/static/src/components/IdeationView.js"></script>
  <script src="/static/src/components/ProjectHome.js"></script>
  <script src="/static/src/components/SettingsView.js"></script>
  <script src="/static/src/app.js"></script>
</body>
</html>
