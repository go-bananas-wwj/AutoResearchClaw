<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResearchClaw — Autonomous Research Pipeline</title>
  <link rel="stylesheet" href="/static/src/styles/main.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>ResearchClaw</h1>
      <span id="server-status" style="font-size:12px;color:var(--text-muted)"></span>
      <span id="connection-badge" class="status-badge idle">Connecting...</span>
      <div style="flex:1"></div>
      <span style="font-size:13px;color:var(--text-secondary)">Autonomous Research Pipeline</span>
      <button id="lang-toggle" style="margin-left:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;font-size:13px" title="Switch language / 切换语言">中文</button>
    </header>

    <!-- Sidebar: project list -->
    <nav class="sidebar proj-sidebar">
      <button class="proj-new-btn" id="btn-new-research">＋ New Research</button>
      <div id="sidebar-projects"></div>
      <div class="proj-side-bottom">
        <a href="#" id="nav-settings">🛠 Settings</a>
        <a href="#" id="nav-about">ℹ About</a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main" id="main-content">
      <p style="color:var(--text-muted)">Loading...</p>
    </main>
  </div>

  <!-- Scripts (no build step needed) -->
  <script src="/static/src/services/i18n.js"></script>
  <script src="/static/src/services/api.js"></script>
  <script src="/static/src/services/websocket.js"></script>
  <script src="/static/src/components/ProjectHome.js"></script>
  <script src="/static/src/components/SettingsView.js"></script>
  <script src="/static/src/app.js"></script>
</body>
</html>
